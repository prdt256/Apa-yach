<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selamat Datang!</title>

  <!-- Tailwind CSS untuk Styling Cepat & Ringan -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Canvas Confetti untuk Efek Interaktif -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    /* Custom Scrollbar Simple */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #eab308; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-amber-400 selection:text-slate-950">

  <!-- Header Simpel -->
  <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
      <span class="font-bold text-amber-400 text-lg tracking-wide">✨ My Portal Gwejh Ingyah</span>
      <span class="text-xs text-slate-400 bg-slate-800 px-3 py-1 rounded-full border border-slate-700">Welcome Page</span>
    </div>
  </header>

  <main class="flex-grow max-w-5xl w-full mx-auto px-4 py-10 space-y-12">
    
    <!-- Hero / Area Sambutan -->
    <section class="text-center py-8 px-6 rounded-3xl bg-slate-900/80 border border-slate-800 shadow-xl relative overflow-hidden">
      <!-- Glow hiasan background -->
      <div class="absolute -top-16 -left-16 w-48 h-48 bg-amber-500/10 rounded-full blur-2xl pointer-events-none"></div>
      <div class="absolute -bottom-16 -right-16 w-48 h-48 bg-emerald-500/10 rounded-full blur-2xl pointer-events-none"></div>

      <span class="inline-block px-3 py-1 text-xs font-semibold text-amber-300 bg-amber-500/10 border border-amber-500/20 rounded-full mb-4">
        👋 Halo, Selamat Datang!
      </span>

      <h1 class="text-3xl sm:text-5xl font-extrabold text-white mb-3">
        Senang Kamu Ada Di Sini!
      </h1>

      <!-- Subtitle dengan Teks Dinamis / Typing Effect -->
      <p class="text-slate-400 text-base sm:text-lg max-w-xl mx-auto min-h-[2.5rem]">
        <span id="typingText"></span><span class="animate-pulse text-amber-400 font-bold">|</span>
      </p>

      <!-- Tombol Interaktif biar gak sepi -->
      <div class="mt-6 flex justify-center gap-3 flex-wrap">
        <button onclick="salamKejutan()" class="px-5 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-sm transition shadow-lg shadow-amber-500/20 flex items-center gap-2">
          <span>🎉 Sapa Dulu, Le!</span>
        </button>
        <a href="#galeri" class="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium transition border border-slate-700">
          👇 Lihat Galeri
        </a>
      </div>
    </section>

    <!-- Section Galeri Foto -->
    <section id="galeri" class="space-y-6">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <div>
          <h2 class="text-xl font-bold text-white">📸 Galeri Kenangan</h2>
          <p class="text-xs text-slate-400">Kumpulan momen & foto pilihan</p>
        </div>
        <span class="text-xs text-slate-500" id="totalFoto">0 Foto</span>
      </div>

      <!-- Grid Tempat Menampilkan Foto -->
      <div id="galleryGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5">
        <!-- Foto-foto akan di-render otomatis oleh JS di bawah -->
      </div>
    </section>

  </main>

  <!-- Footer Simpel -->
  <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    <p>© 2026 Welcome & Gallery Page. Dibuat simpel & estetik.</p>
  </footer>

  <!-- SCRIPT UTAMA & DATA FOTO -->
  <script>
    // 1. DATA FOTO (Kamu tinggal ganti URL gambar, Judul, & Deskripsi di sini le!)
    const fotoList = [
      {
        judul: "Pemandangan Alam",
        deskripsi: "Suasana sejuk di pegunungan.",
        url: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80"
      },
      {
        judul: "Kopi Malam",
        deskripsi: "Nongkrong santai sambil nikmati kopi.",
        url: "https://images.unsplash.com/photo-1511920170033-f8396924c348?auto=format&fit=crop&w=800&q=80"
      },
      {
        judul: "Sudut Kota",
        deskripsi: "Keindahan lampu kota di malam hari.",
        url: "https://images.unsplash.com/photo-1514565131-fce0801e5785?auto=format&fit=crop&w=800&q=80"
      },
      {
        judul: "Senja di Pantai",
        deskripsi: "Momen matahari terbenam yang indah.",
        url: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80"
      },
      {
        judul: "Langit Bintang",
        deskripsi: "Pemandangan malam penuh bintang.",
        url: "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=800&q=80"
      },
      {
        judul: "Jalanan Perbukitan",
        deskripsi: "Petualangan seru menyusuri alam.",
        url: "https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=800&q=80"
      }
    ];

    // 2. Fungsi Render Galeri Foto Ke Halaman
    function tampilkanGaleri() {
      const grid = document.getElementById("galleryGrid");
      document.getElementById("totalFoto").innerText = `${fotoList.length} Foto Tersedia`;
      grid.innerHTML = "";

      fotoList.forEach((item) => {
        const card = document.createElement("div");
        card.className = "group relative rounded-2xl overflow-hidden bg-slate-900 border border-slate-800 shadow-md hover:border-amber-500/50 transition duration-300";

        card.innerHTML = `
          <div class="w-full h-56 bg-slate-950 overflow-hidden">
            <img src="${item.url}" alt="${item.judul}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy" />
          </div>
          <div class="p-4 bg-slate-900">
            <h3 class="font-bold text-slate-100 group-hover:text-amber-400 transition-colors text-base">${item.judul}</h3>
            <p class="text-xs text-slate-400 mt-1">${item.deskripsi}</p>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    // 3. Efek Ketik (Typing Effect) Biar Halaman Gak Sepi
    const kalimat = [
      "Selamat datang di tempat kecil untuk menyimpan berbagai kenangan menarik.",
      "Silakan lihat-lihat koleksi foto dan momen berharga di bawah ini.",
      "Semoga harimu menyenangkan dan selalu dipenuhi kebahagiaan!"
    ];
    let kataIdx = 0;
    let charIdx = 0;
    let isDeleting = false;

    function ketikTeks() {
      const currentKalimat = kalimat[kataIdx];
      const targetEl = document.getElementById("typingText");

      if (isDeleting) {
        targetEl.innerText = currentKalimat.substring(0, charIdx - 1);
        charIdx--;
      } else {
        targetEl.innerText = currentKalimat.substring(0, charIdx + 1);
        charIdx++;
      }

      let speed = isDeleting ? 30 : 50;

      if (!isDeleting && charIdx === currentKalimat.length) {
        speed = 2000; // Tahan sebentar saat selesai ngetik
        isDeleting = true;
      } else if (isDeleting && charIdx === 0) {
        isDeleting = false;
        kataIdx = (kataIdx + 1) % kalimat.length;
        speed = 500;
      }

      setTimeout(ketikTeks, speed);
    }

    // 4. Efek Konfeti saat Klik Tombol Sapa
    function salamKejutan() {
      confetti({
        particleCount: 80,
        spread: 60,
        origin: { y: 0.7 }
      });
    }

    // Jalankan Saat Halaman Selesai Dimuat
    document.addEventListener("DOMContentLoaded", () => {
      tampilkanGaleri();
      ketikTeks();
    });
  </script>

</body>
</html>

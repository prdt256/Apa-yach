<!DOCTYPE html>
<html lang="id" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome & Gallery</title>
 
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              gold: '#D4AF37',
              goldHover: '#F3E5AB',
              emerald: '#059669',
              darkBg: '#0F172A',
              cardBg: '#1E293B'
            }
          }
        }
      }
    }
  </script>


  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
 
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>


  <!-- External Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-brand-darkBg text-slate-100 min-h-screen flex flex-col font-sans selection:bg-amber-500 selection:text-black">


  <!-- Header / Navigation -->
  <header class="sticky top-0 z-40 backdrop-blur-md bg-brand-darkBg/80 border-b border-amber-500/20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-amber-500 to-emerald-500 flex items-center justify-center shadow-lg shadow-amber-500/20">
          <i data-lucide="sparkles" class="w-5 h-5 text-slate-950"></i>
        </div>
        <span class="font-bold text-lg tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-amber-200 to-emerald-400">
          GALLERY PORTAL
        </span>
      </div>


      <nav class="flex items-center space-x-6 text-sm font-medium">
        <a href="#hero" class="hover:text-amber-400 transition-colors">Home</a>
        <a href="#gallery" class="hover:text-amber-400 transition-colors">Galeri</a>
      </nav>
    </div>
  </header>


  <main class="flex-grow">
    <!-- Hero Section -->
    <section id="hero" class="relative py-20 lg:py-28 overflow-hidden flex items-center justify-center">
      <!-- Glow background effects -->
      <div class="absolute -top-24 -left-24 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
      <div class="absolute top-1/2 -right-24 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>


      <div class="max-w-4xl mx-auto px-4 text-center relative z-10">
        <div class="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs font-semibold uppercase tracking-wider mb-6">
          <i data-lucide="star" class="w-3.5 h-3.5"></i>
          <span>Selamat Datang</span>
        </div>
       
        <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight mb-6">
          Kumpulan Kenangan & <br/>
          <span class="text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-yellow-200 to-emerald-400">
            Momen Berharga
          </span>
        </h1>


        <p class="text-slate-400 text-base sm:text-lg max-w-2xl mx-auto mb-8 leading-relaxed">
          Selamat datang di halaman galeri ini, le! Tempat berbagi dan menyimak koleksi foto pilihan terbaik. Silakan jelajahi galeri di bawah.
        </p>


        <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
          <a href="#gallery" class="w-full sm:w-auto px-7 py-3.5 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-bold hover:from-amber-400 hover:to-amber-500 transition shadow-lg shadow-amber-500/20 flex items-center justify-center space-x-2">
            <span>Lihat Galeri</span>
            <i data-lucide="arrow-down" class="w-4 h-4"></i>
          </a>
          <button id="surpriseBtn" class="w-full sm:w-auto px-7 py-3.5 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700 hover:text-white transition flex items-center justify-center space-x-2">
            <i data-lucide="party-popper" class="w-4 h-4 text-amber-400"></i>
            <span>Efek Kejutan</span>
          </button>
        </div>
      </div>
    </section>


    <!-- Gallery Section -->
    <section id="gallery" class="py-16 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 border-t border-slate-800">
      <!-- Category Filter Tabs -->
      <div class="flex flex-wrap items-center justify-center gap-2 sm:gap-4 mb-12" id="filterContainer">
        <button data-filter="all" class="filter-btn active-filter px-5 py-2.5 rounded-full text-sm font-semibold transition-all">
          Semua
        </button>
        <button data-filter="memories" class="filter-btn inactive-filter px-5 py-2.5 rounded-full text-sm font-semibold transition-all">
          Memories
        </button>
        <button data-filter="moments" class="filter-btn inactive-filter px-5 py-2.5 rounded-full text-sm font-semibold transition-all">
          Moments
        </button>
        <button data-filter="favorites" class="filter-btn inactive-filter px-5 py-2.5 rounded-full text-sm font-semibold transition-all">
          Favorites
        </button>
      </div>


      <!-- Gallery Grid -->
      <div id="galleryGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Rendered by JavaScript -->
      </div>
    </section>
  </main>


  <!-- Lightbox Modal -->
  <div id="lightbox" class="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-xl flex items-center justify-center p-4 hidden transition-opacity duration-300 opacity-0">
    <button id="closeLightbox" class="absolute top-5 right-5 text-slate-400 hover:text-white p-2 rounded-full bg-slate-800/50 hover:bg-slate-800 transition">
      <i data-lucide="x" class="w-6 h-6"></i>
    </button>


    <button id="prevBtn" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white p-3 rounded-full bg-slate-800/50 hover:bg-slate-800 transition">
      <i data-lucide="chevron-left" class="w-6 h-6"></i>
    </button>


    <button id="nextBtn" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white p-3 rounded-full bg-slate-800/50 hover:bg-slate-800 transition">
      <i data-lucide="chevron-right" class="w-6 h-6"></i>
    </button>


    <div class="max-w-4xl w-full flex flex-col items-center">
      <div class="relative max-h-[75vh] w-full flex items-center justify-center overflow-hidden rounded-2xl bg-slate-900 border border-slate-800">
        <img id="lightboxImg" src="" alt="Fullscreen Image" class="max-h-[75vh] w-auto object-contain" />
      </div>
      <div class="mt-4 text-center max-w-xl">
        <h3 id="lightboxTitle" class="text-xl font-bold text-amber-300"></h3>
        <p id="lightboxDesc" class="text-slate-400 text-sm mt-1"></p>
      </div>
    </div>
  </div>


  <!-- Footer -->
  <footer class="border-t border-slate-800 py-8 bg-slate-950/40 text-center text-slate-500 text-sm">
    <p>© 2026 Gallery Portal. Handcrafted for awesome memories.</p>
  </footer>


  <!-- External JavaScript -->
  <script src="script.js"></script>
</body>
</html>
